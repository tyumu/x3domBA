<!DOCTYPE html>
<html lang="ja">
  <head>

    <title>タイトル</title>

  <body>
    <h1>タイトル</h1>
    <p>
      作品の説明<br>
      <br>
      視点移動<br>
      左ボタンドラッグ：見回し(Rotate)<br>
      真ん中ボタンドラッグ または Ctrl+左ボタンドラッグ：平行移動(Pan)<br>
      右ボタンドラッグ または ホイール：ズーム(Zoom)<br>
      aキー：オブジェクトを全部見る(Show all)<br>
      uキー：視点の上下を正す(Upright)<br>
      rキー：視点のリセット(Reset)<br>
    </p>
    <div class="buttons group">
        <input type="button" value="ヘッドライト ON" onclick="document.getElementById('navi').setAttribute('headlight','true');"></input>
        <input type="button" value="ヘッドライト OFF" onclick="document.getElementById('navi').setAttribute('headlight','false');"></input>
        <input type="button" value="デバッグ ON" onclick="document.getElementById('x3d').runtime.debug(true);"></input>
        <input type="button" value="デバッグ OFF" onclick="document.getElementById('x3d').runtime.debug(false);"></input>
        <BR>
        <input type="button" value="前の視点" onclick="document.getElementById('x3d').runtime.prevView();"></input>
        <input type="button" value="次の視点" onclick="document.getElementById('x3d').runtime.nextView();"></input>
        <br>
        透視投影：
        <input type="button" value="前から(+Zから)" onclick="document.getElementById('front_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="後から(-Zから)" onclick="document.getElementById('back_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="上から(+Yから)" onclick="document.getElementById('top_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="下から(-Yから)" onclick="document.getElementById('bottom_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="右から(+Xから)" onclick="document.getElementById('right_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="左から(-Xから)" onclick="document.getElementById('left_view').setAttribute('set_bind','true');"></input>
        <br>
        平行投影：
        <input type="button" value="前から(+Zから)" onclick="document.getElementById('ortho_front_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="後から(-Zから)" onclick="document.getElementById('ortho_back_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="上から(+Yから)" onclick="document.getElementById('ortho_top_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="下から(-Yから)" onclick="document.getElementById('ortho_bottom_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="右から(+Xから)" onclick="document.getElementById('ortho_right_view').setAttribute('set_bind','true');"></input>
        <input type="button" value="左から(-Xから)" onclick="document.getElementById('ortho_left_view').setAttribute('set_bind','true');"></input>
        <br>
        新規視点：
    </div>
    <div id="str">Viewpoint</div>
    <x3d id="x3d" style="width:80vw; height:60vw; margin:auto;" showLog="false" showStat="false">
    
      <scene id="scene">
        <!-- ヘッドライトの設定 -->
        <navigationInfo id="navi" headlight="false"></navigationInfo>

        <!-- 太陽光源の設定（複数可） -->
        <!-- direction 光の方向 -->
        <!-- ambientIntensity 環境光の明るさ -->
        <directionalLight direction="-1 -1 -1" color="1 1 1" ambientIntensity="0.2"></directionalLight>

        <!-- 背景の指定 -->
        <background skyColor="0.2 0.2 0.4"></background>

        <!-- 視点の設定（複数可） -->
        <viewpoint id="front_view" description="front" position="0 0 10" orientation="0 1 0 0"></viewpoint>
        <viewpoint id="back_view" description="back" position="0 0 -10" orientation="0 1 0 3.14"></viewpoint>
        <viewpoint id="top_view" description="top" position="0 10 0" orientation="1 0 0 -1.57"></viewpoint>
        <viewpoint id="bottom_view" description="bottom" position="0 -10 0" orientation="1 0 0 1.57"></viewpoint>
        <viewpoint id="right_view" description="right" position="10 0 0" orientation="0 1 0 1.57"></viewpoint>
        <viewpoint id="left_view" description="left" position="-10 0 0" orientation="0 1 0 -1.57"></viewpoint>

        <OrthoViewpoint id="ortho_front_view" description="ortho_front" position="0 0 10" orientation="0 1 0 0" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
        <OrthoViewpoint id="ortho_back_view" description="ortho_back" position="0 0 -10" orientation="0 1 0 3.14" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
        <OrthoViewpoint id="ortho_top_view" description="ortho_top" position="0 10 0" orientation="1 0 0 -1.57" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
        <OrthoViewpoint id="ortho_bottom_view" description="ortho_bottom" position="0 -10 0" orientation="1 0 0 1.57" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
        <OrthoViewpoint id="ortho_right_view" description="ortho_right" position="10 0 0" orientation="0 1 0 1.57" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
        <OrthoViewpoint id="ortho_left_view" description="ortho_left" position="-10 0 0" orientation="0 1 0 -1.57" fieldOfView="[-5,-5,5,5]"></OrthoViewpoint>
